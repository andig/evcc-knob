[platformio]
default_envs = m5dial

[env:m5dial]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	m5stack/M5Dial
	m5stack/M5Unified
	bblanchon/ArduinoJson@^7

; desktop simulator, needs SDL2 (brew install sdl2): pio run -e sim -t exec
[env:sim]
platform = native
build_flags =
	-std=c++17 -lSDL2 -lcurl
	-DM5GFX_BOARD=board_M5Dial -DM5GFX_SCALE=2 -DM5GFX_SHOW_FRAME
	-I"${sysenv.HOMEBREW_PREFIX}/include/SDL2" -L"${sysenv.HOMEBREW_PREFIX}/lib"
	-I/usr/local/include/SDL2 -L/usr/local/lib
	-I/usr/include/SDL2
lib_deps =
	m5stack/M5Unified
	bblanchon/ArduinoJson@^7
